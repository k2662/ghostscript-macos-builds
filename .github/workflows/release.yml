name: Release Ghostscript (macOS)

on:
  workflow_dispatch:
    inputs:
      gs_version:
        description: "Ghostscript version to build, e.g. 10.07.1"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build gs (arm64, all variants)
        env:
          GS_VERSION: ${{ inputs.gs_version }}
        run: |
          for variant in full standard; do
            VARIANT="${variant}" ./build/build-macos.sh
          done

      - name: Verify all variants
        run: |
          for variant in full standard; do
            ./build/verify.sh "dist/gs-arm64-${variant}"
          done

      # No Apple Developer ID certificate is available, so binaries are
      # released unsigned/un-notarized on purpose. Consumers must strip
      # com.apple.quarantine after downloading (see README's integration
      # contract, and docs/PLAN §9/§12). Revisit if a Developer ID cert
      # becomes available: add codesign + notarize here.

      - name: Fetch corresponding source tarball (AGPL-3.0 §6)
        env:
          GS_VERSION: ${{ inputs.gs_version }}
        run: |
          GS_TAG="gs$(echo "${GS_VERSION}" | tr -d '.')"
          curl -fL -o "dist/ghostpdl-${GS_VERSION}.tar.gz" \
            "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/${GS_TAG}/ghostpdl-${GS_VERSION}.tar.gz"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 gs-arm64-full gs-arm64-standard ghostpdl-*.tar.gz > SHA256SUMS

      - name: Compute release metadata
        id: meta
        run: |
          echo "tag=gs-${{ inputs.gs_version }}" >> "$GITHUB_OUTPUT"
          for variant in full standard; do
            echo "sha256_${variant}=$(shasum -a 256 dist/gs-arm64-${variant} | awk '{print $1}')" >> "$GITHUB_OUTPUT"
            echo "size_${variant}=$(wc -c < dist/gs-arm64-${variant} | tr -d ' ')" >> "$GITHUB_OUTPUT"
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.meta.outputs.tag }}" --yes --cleanup-tag || true
          gh release create "${{ steps.meta.outputs.tag }}" \
            dist/gs-arm64-full dist/gs-arm64-standard \
            dist/SHA256SUMS dist/ghostpdl-*.tar.gz LICENSE \
            --title "Ghostscript ${{ inputs.gs_version }} (macOS arm64)" \
            --notes "Ghostscript ${{ inputs.gs_version }} for macOS arm64 (Apple Silicon), two variants (see README): gs-arm64-full (all upstream devices, ~349) and gs-arm64-standard (pdfwrite/ps2write/pngalpha/jpeg/tiff24nc — recommended default). Source attached as ghostpdl-${{ inputs.gs_version }}.tar.gz — AGPL-3.0 §6 corresponding source. See README.md for the full compliance notice."

      - name: Update manifest.json
        run: |
          cat > manifest.json <<EOF
          {
            "\$schema": "https://json-schema.org/draft/2020-12/schema",
            "ghostscriptVersion": "${{ inputs.gs_version }}",
            "releaseTag": "${{ steps.meta.outputs.tag }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-arm64": {
                "full": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/gs-arm64-full",
                  "sha256": "${{ steps.meta.outputs.sha256_full }}",
                  "size": ${{ steps.meta.outputs.size_full }},
                  "devices": "all upstream device drivers (~349)"
                },
                "standard": {
                  "url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/gs-arm64-standard",
                  "sha256": "${{ steps.meta.outputs.sha256_standard }}",
                  "size": ${{ steps.meta.outputs.size_standard }},
                  "devices": "pdfwrite, ps2write, pngalpha, jpeg, tiff24nc"
                }
              }
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest.json for ${{ steps.meta.outputs.tag }}"
          git push
