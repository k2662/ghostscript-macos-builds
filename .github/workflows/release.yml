name: Release Ghostscript (macOS)

on:
  workflow_dispatch:
    inputs:
      gs_version:
        description: "Ghostscript version to build, e.g. 10.07.1"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build gs (arm64)
        env:
          GS_VERSION: ${{ inputs.gs_version }}
        run: ./build/build-macos.sh

      - name: Verify
        run: ./build/verify.sh dist/gs-arm64

      # No Apple Developer ID certificate is available, so binaries are
      # released unsigned/un-notarized on purpose. Consumers must strip
      # com.apple.quarantine after downloading (see README's integration
      # contract, and docs/PLAN §9/§12). Revisit if a Developer ID cert
      # becomes available: add codesign + notarize here.

      - name: Fetch corresponding source tarball (AGPL-3.0 §6)
        env:
          GS_VERSION: ${{ inputs.gs_version }}
        run: |
          GS_TAG="gs$(echo "${GS_VERSION}" | tr -d '.')"
          curl -fL -o "dist/ghostpdl-${GS_VERSION}.tar.gz" \
            "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/${GS_TAG}/ghostpdl-${GS_VERSION}.tar.gz"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 gs-arm64 ghostpdl-*.tar.gz > SHA256SUMS

      - name: Compute release metadata
        id: meta
        run: |
          echo "tag=gs-${{ inputs.gs_version }}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 dist/gs-arm64 | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(wc -c < dist/gs-arm64 | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            dist/gs-arm64 dist/SHA256SUMS dist/ghostpdl-*.tar.gz LICENSE \
            --title "Ghostscript ${{ inputs.gs_version }} (macOS arm64)" \
            --notes "Ghostscript ${{ inputs.gs_version }}, built from upstream GhostPDL source for macOS arm64 (Apple Silicon) only. Source attached as ghostpdl-${{ inputs.gs_version }}.tar.gz — AGPL-3.0 §6 corresponding source. See README.md for the full compliance notice."

      - name: Update manifest.json
        run: |
          cat > manifest.json <<EOF
          {
            "\$schema": "https://json-schema.org/draft/2020-12/schema",
            "ghostscriptVersion": "${{ inputs.gs_version }}",
            "releaseTag": "${{ steps.meta.outputs.tag }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-arm64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/gs-arm64",
                "sha256": "${{ steps.meta.outputs.sha256 }}",
                "size": ${{ steps.meta.outputs.size }}
              }
            }
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "chore: update manifest.json for ${{ steps.meta.outputs.tag }}"
          git push
